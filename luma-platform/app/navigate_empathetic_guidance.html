<style>

<script>
        // Simple Interaction logic for demo
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.querySelector('input');
            const chatAnchor = document.getElementById('chat-anchor');
            const hint = document.getElementById('initial-hint');

            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && input.value.trim() !== '') {
                    // Hide hint
                    hint.style.opacity = '0';
                    
                    // Create user message
                    const msg = input.value;
                    const userDiv = document.createElement('div');
                    userDiv.className = 'flex justify-end';
                    userDiv.innerHTML = `
                        <div class="user-bubble px-6 py-4 rounded-[28px] max-w-[85%] text-on-primary shadow-lg animate-in slide-in-from-right-4 duration-300">
                            <p class="font-body-md text-body-md">${msg}</p>
                        </div>
                    `;
                    chatAnchor.parentNode.insertBefore(userDiv, chatAnchor);
                    input.value = '';

                    // Simulate Luma typing
                    setTimeout(() => {
                        const lumaLoading = document.createElement('div');
                        lumaLoading.className = 'flex items-end gap-3 animate-pulse';
                        lumaLoading.innerHTML = `
                            <div class="w-8 h-8 rounded-full bg-primary-container/10 border border-primary/20 flex items-center justify-center shrink-0">
                                <span class="material-symbols-outlined text-primary scale-75" data-icon="auto_awesome">auto_awesome</span>
                            </div>
                            <div class="luma-bubble glass-panel px-6 py-4 rounded-[28px] italic text-on-surface-variant/60">
                                Luma is reflecting...
                            </div>
                        `;
                        chatAnchor.parentNode.insertBefore(lumaLoading, chatAnchor);
                        
                        // Scroll to bottom
                        document.querySelector('main').scrollTo({ top: document.querySelector('main').scrollHeight, behavior: 'smooth' });

                        setTimeout(() => {
                            lumaLoading.remove();
                            const response = document.createElement('div');
                            response.className = 'flex items-end gap-3 group';
                            response.innerHTML = `
                                <div class="w-8 h-8 rounded-full bg-primary-container/10 border border-primary/20 flex items-center justify-center shrink-0 mb-1">
                                    <span class="material-symbols-outlined text-primary scale-75" data-icon="auto_awesome">auto_awesome</span>
                                </div>
                                <div class="luma-bubble glass-panel px-6 py-4 rounded-[28px] max-w-[85%] text-on-surface animate-in slide-in-from-left-4 duration-500">
                                    <p class="font-body-md text-body-md">Close your eyes for a moment. Imagine you are a leaf floating on a calm, deep emerald pond. Every breath you take is a tiny ripple moving away from you, taking a small piece of that weight with it. Stay here for three breaths.</p>
                                </div>
                            `;
                            chatAnchor.parentNode.insertBefore(response, chatAnchor);
                            document.querySelector('main').scrollTo({ top: document.querySelector('main').scrollHeight, behavior: 'smooth' });
                        }, 2000);
                    }, 1000);
                }
            });
        });
    </script>
